[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mcserverwatcher"
version = "1.0.0"
description = "A small web dashboard and JSON API for Minecraft Java server status."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.1,<4",
    "mcstatus>=14.1,<15",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
]

[project.scripts]
mcserverwatcher = "mcserverwatcher.app:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcserverwatcher = ["templates/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
